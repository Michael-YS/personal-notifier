limit_req_zone $binary_remote_addr zone=personal_notify:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name notify.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/personal-notify-acme;
    }
    location / { return 308 https://notify.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notify.example.com;
    ssl_certificate /etc/letsencrypt/live/notify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notify.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 16k;
    access_log off;
    location / {
        limit_req zone=personal_notify burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
