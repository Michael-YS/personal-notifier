name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check server tests
      - run: uv run ruff format --check server tests

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu 24.04 runners include Android SDK 35 and build tools 35.0.0.
      - name: Build and lint without Firebase credentials
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PbuildCheck=true assembleDebug assembleDebugAndroidTest lintDebug
