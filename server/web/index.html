<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notify · 设备配对</title><link rel="stylesheet" href="/pair.css"><script src="/pair.js" defer></script></head>
<body><main><p class="eyebrow">PERSONAL NOTIFY</p><h1>把通知送到你的手机</h1><p>输入管理密码生成二维码，然后在 Android App 中点击「扫码配对」。</p><form id="pair"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><label for="device">新设备名称</label><input id="device" required pattern="[A-Za-z0-9_-]{1,64}" maxlength="64"><small>每台设备使用不同名称，例如 phone、tablet。</small><button id="generate">生成配对二维码</button></form><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><img id="qr" alt="一次性设备配对二维码"><p id="expiry"></p><small>二维码仅供自己扫描，请勿分享。失效后可重新生成。</small></section></main></body></html>
