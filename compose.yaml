services:
  notify:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NOTIFY_STATE_FILE: /app/data/devices.json
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-secrets/firebase-service-account.json}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - notify-data:/app/data
      - ./secrets:/app/secrets:ro
volumes:
  notify-data:
